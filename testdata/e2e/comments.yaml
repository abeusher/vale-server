  - name: inline-vale-off
    about: "#1001"
    args: issue1001.md
    exit: 0
    want: |
      issue1001.md:5:28:demo.Ending-Preposition:Don't end a sentence with 'of.'

  - name: inline-comment-spacing
    about: "#882 -- text after a comment keeps its own leading space instead of
      fusing with the text before it; inside a still-open inline element the
      opening tag stays the boundary, so `sona` isn't fused into `sonata`"
    args: issue882.md
    exit: 1
    want: |
      issue882.md:4:3:Vale.Spelling:Did you really mean 'sona'?

  - name: inline-comment-keeps-space
    about: "A comment is masked out of its paragraph. The whitespace the
      source put before it still separates the words on either side, so
      `firstt, <!-- c -->then` reads as `firstt, then`, not `firstt,then`."
    files:
      .vale.ini: |
        MinAlertLevel = suggestion

        [*]
        BasedOnStyles = Vale
      test.md: |
        Prose firstt, <!-- note -->then a commentt mid-line.

        Prose secondd <!-- note --> then a commentt.

        Prose thirdd <!-- note -->then.

        Prose fourthh<!-- note --> then.
    args: --output=line --no-exit test.md
    exit: 0
    want: |
      test.md:1:7:Vale.Spelling:Did you really mean 'firstt'?
      test.md:1:35:Vale.Spelling:Did you really mean 'commentt'?
      test.md:3:7:Vale.Spelling:Did you really mean 'secondd'?
      test.md:3:36:Vale.Spelling:Did you really mean 'commentt'?
      test.md:5:7:Vale.Spelling:Did you really mean 'thirdd'?
      test.md:7:7:Vale.Spelling:Did you really mean 'fourthh'?

  - name: mdx-repeated-text-in-off-region
    about: "#1032 -- the same paragraph repeated inside a vale-off region
      and inside code fences. A block's later matches used to be located
      in the next copy of its text, since the earlier matches had been
      masked out of the block, which put them outside the region."
    files:
      .vale.ini: |
        MinAlertLevel = suggestion

        [*.mdx]
        BasedOnStyles = Vale
      test.mdx: |
        owner: Could not determine whether revision 1 is supported, assuming it is.
        iptables v1.8.9 (legacy): can't initialize iptables table `raw': Permission denied.
        Perhaps iptables or your kernel needs to be upgraded.

        {/* vale off */}

        owner: Could not determine whether revision 1 is supported, assuming it is.
        iptables v1.8.9 (legacy): can't initialize iptables table `raw': Permission denied.
        Perhaps iptables or your kernel needs to be upgraded.

        {/* vale on */}

        {/* vale off */}
        ```
        owner: Could not determine whether revision 1 is supported, assuming it is.
        iptables v1.8.9 (legacy): can't initialize iptables table `raw': Permission denied.
        Perhaps iptables or your kernel needs to be upgraded.
        ```
        {/* vale on */}

        {/* vale off */}
        ```shell
        owner: Could not determine whether revision 1 is supported, assuming it is.
        iptables v1.8.9 (legacy): can't initialize iptables table `raw': Permission denied.
        Perhaps iptables or your kernel needs to be upgraded.
        ```
        {/* vale on */}

        {/* vale off */}
        ```shell {2,4} mark="determine"
        owner: Could not determine whether revision 1 is supported, assuming it is.
        iptables v1.8.9 (legacy): can't initialize iptables table `raw': Permission denied.
        Perhaps iptables or your kernel needs to be upgraded.
        ```
        {/* vale on */}
    args: --output=line --no-exit test.mdx
    exit: 0
    want: |
      test.mdx:2:1:Vale.Spelling:Did you really mean 'iptables'?
      test.mdx:2:44:Vale.Spelling:Did you really mean 'iptables'?
      test.mdx:3:9:Vale.Spelling:Did you really mean 'iptables'?
